[project]
name = "langchain-rag"
version = "0.1.0"
description = "Production RAG lessons with LangChain, Chroma and local Ollama models (optional Gemini)"
readme = "README.md"
authors = [
    { name = "Vasilis", email = "35334907+dimvasdim@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
